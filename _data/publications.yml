  - title: "Study to evaluate the future data compilation for the Swiss Consumer Sentiment Index"
    # Author order per the report's own recommended citation (p. 1 of the PDF):
    # FORS (Lausanne) authors first, then IRENE.
    authors:
      - {name: "Georg Lutz"}
      - {name: "Boris Wernli"}
      - {name: "Erika Antal"}
      - {name: "Oliver Lipps"}
      - {name: "Victor Legler"}
      - {name: "Daniel Kaufmann"}
      - {name: "Marc Burri", url: "https://marcburri.github.io/"}
    year: 2024
    journal: "Grundlagen für die Wirtschaftspolitik 43, Staatssekretariat für Wirtschaft SECO"
    abstract: >
      This evaluation, conducted by FORS in collaboration with IRENE, examined possible design features for the future compilation of the Swiss Consumer Sentiment Index. The way consumer sentiment is calculated in Switzerland is well in line with similar measures elsewhere, but Switzerland is the only country under review collecting data only quarterly, which severely limits the information available for business cycle monitoring. Assuming at least a monthly index is to be calculated, the report recommends a weekly rolling cross-section design with 500 weekly target interviews, a single-mode web-only survey with offline recruitment, and model-based retropolation to extend the monthly indicator back in time.
    links:
      paper: "https://www.seco.admin.ch/dam/de/sd-web/RPOVmimua2zJ/2024-02-wp-43-Future-Data-Compilation-Swiss-Consumer-Sentiment-Index-SECO.pdf"

  - title: "Do bonuses offset the allocative effects of downward rigid base wages?"
    authors:
      - {name: "Anne Kathrin Funk", url: "https://sites.google.com/view/annekathrinfunk/home"}
      - {name: "Daniel Kaufmann"}
    year: 2022
    journal: "American Economic Review: Papers & Proceedings"
    volume: "112"
    pages: "486–490"
    doi: "10.1257/pandp.20221097"
    abstract: >
      We measure the labor market outcomes of employees with downward rigid base wages after an unexpected deflationary shock in Switzerland using a firm survey matched with Social Security register data. The employees that additionally receive downward flexible compensation, such as bonuses, are less likely to lose their job after a deflationary shock than those only receiving a base wage. Only a modest share of employees receives downward flexible compensation, however. Therefore, these compensation schemes do not offset the overall allocative effects of downward rigid base wages. 
    links:
      paper: "https://doi.org/10.1257/pandp.20221097"

  - title: "Some implications of the new agreement on the distribution of SNB profits"
    authors:
      - {name: "Daniel Kaufmann"}
    year: 2021
    journal: "IRENE Policy Reports 21-01, Institute of Economic Research, University of Neuchâtel"
    abstract: >
      I simulate the distribution of SNB profits to the Confederation and Cantons under a hypothetical scenario, in which the new agreement between the Swiss National Bank and the Federal Department of Finance would have been in place from 2005-2019. All else equal, the new agreement leads to: (i) a higher average profit distribution; (ii) larger annual fluctuations of profit distributions, complicating fiscal authorities' budget planning; (iii) pro-cyclical profit distributions (lower [higher] during economic recessions [booms]). Having said that, the SNB's profit distributions account for a relatively modest share of total government expenditures. In addition, to offset the volatile and pro-cyclical profit distributions, fiscal authorities may borrow on capital markets.
    links:
      paper: "https://ideas.repec.org/p/irn/polrep/21-01.html"

  - title: "Wie weiter mit der Tiefzinspolitik? Szenarien und Alternativen"
    authors:
      - {name: "Daniel Kaufmann"}
    year: 2020
    journal: "IRENE Policy Reports 20-01, Institute of Economic Research, University of Neuchâtel"
    abstract: >
      Diese Studie zeigt wie sich ein vorzeitiger Ausstieg aus der Tiefzinspolitik auf den Wechselkurs und die schweizerische Wirtschaft auswirken würde. Ein überraschender Ausstieg aus der Tiefzinspolitik würde den Schweizer Franken um 3-7% aufwerten. Zudem würde dies zu einem Rückgang der Wirtschaftsaktivität und der Konsumentenpreise führen. Es gibt jedoch alternative geldpolitische Strategien, die den Franken schwächen und die Nominalzinsen erhöhen. Dies würde eine höhere Inflationsrate erfordern.
    links:
      paper: "https://ideas.repec.org/p/irn/polrep/20-01.html"
      code: "https://github.com/dankaufmann/lir"
    news:
      - {label: "Le Temps", url: "https://www.letemps.ch/economie/finance/daniel-kaufmann-fin-taux-negatifs-rencherirait-franc-3-7"}

