  - title: "Is deflation costly after all? The perils of erroneous historical classifications"
    authors:
      - {name: "Daniel Kaufmann"}
    year: 2020
    journal: "Journal of Applied Econometrics"
    volume: "35(5)"
    pages: "614–628"
    doi: "10.1002/jae.2762"
    abstract: >
      I propose a GMM estimator to estimate the relationship between deflation
      and real activity in the US controlling for measurement error in 19th
      century price data. I find a relevant short-fall in real activity when
      prices were falling.
    links:
      paper: "https://doi.org/10.1002/jae.2762"
      wp: "http://dx.doi.org//10.3929/ethz-a-010786535"
      update: "/files/Deflation_Costly_Update.pdf"
      code: "https://github.com/dankaufmann/historical_inflation"

  - title: "Trend fundamentals and exchange rate dynamics"
    authors:
      - {name: "Florian Huber"}
      - {name: "Daniel Kaufmann"}
    year: 2020
    journal: "Economica"
    volume: "87"
    doi: "10.1111/ecca.12334"
    abstract: >
      We propose a multivariate unobserved-components stochastic volatility
      model to explain exchange rate dynamics. We find that changes in trend
      inflation is a relevant factor explaining the persistence of exchange
      rate fluctuations.
    links:
      paper: "https://doi.org/10.1111/ecca.12334"
      wp: "http://dx.doi.org//10.3929/ethz-a-010513063"
      update: "/files/TrendFundamentals_Update.pdf"

  - title: "Constrained interest rates and changing dynamics at the zero lower bound"
    authors:
      - {name: "Gregor Bäurle", url: "http://www.gregorbaeurle.ch/"}
      - {name: "Daniel Kaufmann"}
      - {name: "Sylvia Kaufmann"}
      - {name: "Rodney Strachan"}
    year: 2019
    journal: "Studies in Nonlinear Dynamics & Econometrics"
    volume: "24(2)"
    doi: "10.1515/snde-2017-0098"
    award: "Best paper award, SNDE 2020"
    abstract: >
      We propose a VAR with endogenous regime-switching to measure the impact
      of risk premium shocks with binding and non-binding effective lower bound
      in Switzerland. The effective lower bound leads to more persistent
      declines in the price level and a more persistent appreciation.
    links:
      paper: "https://doi.org/10.1515/snde-2017-0098"
      wp: "http://www.szgerzensee.ch/fileadmin/Dateien_Anwender/Dokumente/working_papers/wp-1602.pdf"

  - title: "Nominal stability over two centuries"
    authors:
      - {name: "Daniel Kaufmann"}
    year: 2019
    journal: "Swiss Journal of Economics and Statistics"
    volume: "155(7)"
    pages: "1–23"
    doi: "10.1186/s41937-019-0033-7"
    abstract: >
      I estimate nominal trends for Switzerland from 1800–2017 using an
      unobserved-components stochastic-volatility model. Today's monetary
      regime, flexible inflation targeting, is the most stable monetary regime.
    links:
      paper: "https://sjes.springeropen.com/articles/10.1186/s41937-019-0033-7"
      wp: "http://dx.doi.org//10.3929/ethz-a-010416200"
      update: "/files/NominalStability_Update.pdf"
      code: "https://drive.switch.ch/index.php/s/AUto4oc7PQJxZ72"

  - title: "Measuring exchange rate, price, and output dynamics at the effective lower bound"
    authors:
      - {name: "Gregor Bäurle", url: "http://www.gregorbaeurle.ch/"}
      - {name: "Daniel Kaufmann"}
    year: 2018
    journal: "Oxford Bulletin of Economics and Statistics"
    volume: "80(6)"
    pages: "1243–1266"
    doi: "10.1111/obes.12260"
    abstract: >
      We propose a VAR with exogenous regime-switching to measure the impact of
      risk premium shocks with binding and non-binding effective lower bound in
      Switzerland. The effective lower bound leads to more persistent declines
      in the price level and a more persistent appreciation.
    links:
      paper: "https://onlinelibrary.wiley.com/doi/epdf/10.1111/obes.12260"
      wp: "https://ideas.repec.org/p/snb/snbwpa/2014-10.html"
      update: "/files/ExchangeRatePriceOutput_Update.pdf"
      appendix: "/files/ExchangeRatePriceOutput_Appendix.pdf"
    news:
      - {label: "Jackson Hole speech, T. Jordan", url: "https://www.snb.ch/en/mmr/speeches/id/ref_20150828_tjn/source/ref_20150828_tjn.en.pdf"}

  - title: "Business tendency surveys and macroeconomic fluctuations"
    authors:
      - {name: "Daniel Kaufmann"}
      - {name: "Rolf Scheufele"}
    year: 2017
    journal: "International Journal of Forecasting"
    volume: "33(4)"
    pages: "878–893"
    doi: "10.1016/j.ijforecast.2017.04.005"
    abstract: >
      We use a mixed-frequency factor model to examine the forecasting
      performance of Swiss business tendency survey data. Business tendency
      surveys provide additional information for forecasting inflation,
      employment growth, and the output gap.
    links:
      paper: "http://www.sciencedirect.com/science/article/pii/S0169207017300547"
      wp: "http://dx.doi.org//10.3929/ethz-a-010416189"
      update: "/files/BusinessTendencySurveys_Update.pdf"

  - title: "Sticky prices or rational inattention — What can we learn from sectoral price data?"
    authors:
      - {name: "Daniel Kaufmann"}
      - {name: "Sarah Lein", url: "http://www.sarah-lein.ch/"}
    year: 2013
    journal: "European Economic Review"
    volume: "64"
    pages: "384–394"
    doi: "10.1016/j.euroecorev.2013.10.001"
    abstract: >
      We use a factor model to document stylized facts for Swiss sectoral
      dynamics and confront these facts with two popular price-setting models.
      Overall, the findings tend to support multi-sector models with sticky
      prices rather than rational inattention.
    links:
      paper: "http://www.sciencedirect.com/science/article/pii/S0014292113001281"

  - title: "Combining disaggregate forecasts for inflation: The SNB's ARIMA model"
    authors:
      - {name: "Marco Huwiler"}
      - {name: "Daniel Kaufmann"}
    year: 2013
    journal: "Swiss National Bank Economic Study"
    volume: "No. 7"
    abstract: >
      We evaluate the SNB's short-term forecasting model based on sectoral
      inflation rates and propose a state-space model to deal with changes in
      the survey frequency over time. The model performs well relative to
      various benchmarks, in particular, over short-term horizons.
    links:
      paper: "http://ideas.repec.org/p/snb/snbecs/2013-07.html"

  - title: "Asymmetries in price-setting behavior: New microeconometric evidence from Switzerland"
    authors:
      - {name: "Bo E. Honoré", url: "https://www.princeton.edu/~honore/"}
      - {name: "Daniel Kaufmann"}
      - {name: "Sarah Lein", url: "http://www.sarah-lein.ch/"}
    year: 2012
    journal: "Journal of Money, Credit and Banking"
    volume: "44"
    pages: "211–236"
    doi: "10.1111/j.1538-4616.2012.00558.x"
    abstract: >
      We propose an econometric framework to estimate reduced-form
      (S,s)-pricing rules from firm-level price data. Applying the estimator to
      Swiss data, we find that the prevalence of positive relative to negative
      price changes is largely due to a positive aggregate inflation trend.
    links:
      paper: "http://ideas.repec.org/a/mcb/jmoncb/v44y2012ip211-236.html"
      wp: "http://www.snb.ch/n/mmr/reference/working_paper_2012_09/source/working_paper_2012_09.en.pdf"
    news:
      - {label: "Jackson Hole speech, T. Jordan", url: "https://www.snb.ch/en/mmr/speeches/id/ref_20150828_tjn/source/ref_20150828_tjn.en.pdf"}

  - title: "Is there a Swiss price puzzle?"
    authors:
      - {name: "Daniel Kaufmann"}
      - {name: "Sarah Lein", url: "http://www.sarah-lein.ch/"}
    year: 2012
    journal: "Swiss Journal of Economics and Statistics"
    volume: "148(I)"
    pages: "57–75"
    doi: "10.1007/bf03399360"
    abstract: >
      We use a factor model and Swiss sectoral price data to examine whether
      there is a price puzzle, i.e. an increase in the price level after a
      restrictive monetary policy shock.
    links:
      paper: "http://www.sjes.ch/papers/2012-I-3.pdf"

