  - title: "Do bonuses offset the allocative effects of downward rigid base wages?"
    authors:
      - {name: "Anne Kathrin Funk", url: "https://sites.google.com/view/annekathrinfunk/home"}
      - {name: "Daniel Kaufmann"}
    year: 2022
    journal: "American Economic Review: Papers & Proceedings"
    volume: "112"
    pages: "486–490"
    doi: "10.1257/pandp.20221097"
    abstract: >
      We examine whether downward flexible wage components, such as bonuses,
      are used as a margin of adjustment to circumvent base wage rigidities.
      Those components indeed mitigate the allocative effects of downward
      nominal wage rigidity. At least in Switzerland, they do not suffice to
      completely offset the allocative effects of downward rigid base wages.
    links:
      paper: "https://doi.org/10.1257/pandp.20221097"

