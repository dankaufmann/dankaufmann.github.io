articles:
  - title: "Multiple monetary policy shocks from daily data: A heteroskedasticity IV approach"
    authors:
      - {name: "Marc Burri", url: "https://marcburri.github.io/"}
      - {name: "Daniel Kaufmann"}
    year: 2026
    journal: "Economics Letters"
    volume: "268"
    pages: "113091"
    doi: "10.1016/j.econlet.2026.113091"
    abstract: >
      We identify the causal effects of target and path shocks using IVs
      exploiting the change in the variance-covariance matrix of financial
      market variables on days with monetary policy announcements.
    links:
      paper: "https://doi.org/10.1016/j.econlet.2026.113091"
      wp: "https://ideas.repec.org/p/irn/wpaper/26-06.html"
      code: "https://github.com/dankaufmann/hetiv"

  - title: "Private money and money market integration: The role of payments infrastructure in 19th century Switzerland, 1846–1893"
    authors:
      - {name: "Daniel Kaufmann"}
      - {name: "Rebecca Stuart", url: "https://www.rebeccastuart.net/"}
    year: 2026
    journal: "Economic History Review"
    pages: "1–22"
    doi: "10.1111/ehr.70131"
    abstract: >
      We show that discount rate dispersion, a measure of financial market
      segmentation, was relatively high under a period of unregulated free
      banking. Only with the Banknote Act of 1881 did discount rate dispersion
      fall to similar levels as in other countries. Therefore, we argue that
      bank regulation was a key factor driving money market integration in
      Switzerland.
    links:
      paper: "https://doi.org/10.1111/ehr.70131"
      wp: "https://ideas.repec.org/p/irn/wpaper/24-05.html"
      data: "/files/DiscountRateData_Public.xlsx"

  - title: "Overnight rate and signalling effects of central bank bills"
    authors:
      - {name: "Fabio Canetg", url: "https://sites.google.com/view/fabiocanetg/home"}
      - {name: "Daniel Kaufmann"}
    year: 2022
    journal: "European Economic Review"
    volume: "143"
    doi: "10.1016/j.euroecorev.2022.104060"
    note: "A previous version was titled 'Shocking interest rate floors'."
    abstract: >
      We identify the causal effect of surprise changes in an interest rate
      floor exploiting regular auctions of SNB Bills (Swiss central bank debt
      securities). We find that a restrictive interest rate floor shock causes
      a higher money market rate, an appreciation of the Swiss franc, and a
      decline in stock prices.
    links:
      paper: "https://doi.org/10.1016/j.euroecorev.2022.104060"
      wp: "https://ideas.repec.org/p/irn/wpaper/19-02.html"
      appendix: "https://drive.switch.ch/index.php/s/ZMSc9RhKizOKQhU"
      code: "https://drive.switch.ch/index.php/s/YCvU1ahOXuHulMD"
    news:
      - {label: "Finanz und Wirtschaft", url: "/files/OvernightRate_FinanzUndWirtschaft.pdf"}

  - title: "Do sticky wages matter? New evidence from matched firm-survey and register data"
    authors:
      - {name: "Anne Kathrin Funk", url: "https://sites.google.com/view/annekathrinfunk/home"}
      - {name: "Daniel Kaufmann"}
    year: 2022
    journal: "Economica"
    volume: "89(355)"
    pages: "689–712"
    doi: "10.1111/ecca.12412"
    abstract: >
      We examine the role of wage rigidities after the Swiss National Bank
      removed an exchange rate floor leading to a 1% decline in the price
      level. We find that sticky wages caused a 0.3% decline in income, 0.9%
      decline in employment income, and a 0.05 percentage point increase in
      the unemployment rate.
    links:
      paper: "https://doi.org/10.1111/ecca.12412"
      wp: "https://ideas.repec.org/p/irn/wpaper/20-06.html"
      appendix: "https://drive.switch.ch/index.php/s/kPvvEukfN0ZLjmb"
    news:
      - {label: "Tages-Anzeiger", url: "https://blog.tagesanzeiger.ch/nevermindthemarkets/index.php/46157/mehr-lohn-trotz-krise/"}

