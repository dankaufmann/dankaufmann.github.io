# ---------------------------------------------------------------------------
# Datasets constructed by Daniel. Add an entry per dataset; drop the file into
# site/files/ and point `download` at it (a site-relative path).
#
# Fields: title, coverage, updated, description, notes, citation,
#         download, paper, code
# ---------------------------------------------------------------------------

- title: "Swiss discount rates, 1834–1893"
  coverage: "Daily, weekly, monthly and annual · 8 cities · 1834–1893"
  updated: "2026-07-17"
  description: >
    Discount rates for Swiss cantonal and private banks in Bern, Basel, Zurich,
    St. Gallen, Lausanne and Geneva, underlying our study of money market
    integration in nineteenth-century Switzerland. Annual series include the 
    existing data from Jöhr (1915) for comparison and accuracy
    checks. Detailed sources are given in Appendix B of the paper.
  notes: >
    We recommend the use of weekly data. Daily discount rates are partly sourced
    from newspapers, which may be subject to brief publication lags.
  citation: >
    Kaufmann, D., and Stuart, R., ‘Private money and money market integration:
    The role of payments infrastructure in nineteenth-century Switzerland’,
    Economic History Review, 2026.
  download: "/files/DiscountRateData_Public.xlsx"
  paper: "https://doi.org/10.1111/ehr.70131"
