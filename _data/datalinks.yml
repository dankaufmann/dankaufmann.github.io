# ---------------------------------------------------------------------------
# Data maintained by other researchers and institutions.
# Ported from the Wix "DATA & LINKS" page, 2026-09-01.
# ---------------------------------------------------------------------------

historical:
  - region: Multicountry
    items:
      - name: Macrohistory
        description: "Multicountry annual macroeconomic data set for 17 countries starting in the late 19th century. Maintained by the Macrohistory Lab Bonn."
        links: [{label: "Link", url: "http://www.macrohistory.net/"}]
      - name: IISH
        description: "List of links to price and wage data covering many countries and episodes."
        links: [{label: "Link", url: "http://www.iisg.nl/hpw/"}]
      - name: EH.net
        description: "Database of the Economic History Association making available data sets from economic historians. Covers mostly US and UK."
        links: [{label: "Link", url: "http://eh.net/databases/"}]
      - name: GPIH
        description: "Global Price and Income History Group of UC Davis. Worldwide data before 1950."
        links: [{label: "Link", url: "http://gpih.ucdavis.edu/"}]
      - name: David S. Jacks
        description: "Trade and commodity price data for various countries starting in the 18th century."
        links: [{label: "Link", url: "https://davidjacks.org/data/"}]

  - region: United States
    items:
      - name: "Historical Statistics of the United States (HSUS)"
        description: "Extensive macroeconomic and social data for the US starting in the 18th century. Downloads are gated."
        links: [{label: "Link", url: "http://hsus.cambridge.org"}]
      - name: FRASER
        description: "Archive of historical documents for the US, safeguarding and providing access to economic history — particularly the history of the Federal Reserve System."
        links: [{label: "Link", url: "https://fraser.stlouisfed.org"}]
      - name: "NBER Macrohistory"
        description: "Historical database of the NBER covering many aspects of the pre-WWI and interwar economy. Some coverage of the UK, France and Germany. These data are also available on [FRED](https://fred.stlouisfed.org/release?rid=257&soid=55)."
        links:
          - [{label: "Link", url: "http://www.nber.org/databases/macrohistory/contents/"}]
      - name: MeasuringWorth
        description: "GDP, price and wage data for the US. Linked series starting in the 18th century and updated with modern data. Series are spliced from various sources and subject to a referee process. Free use upon request."
        links: [{label: "Link", url: "https://www.measuringworth.com/"}]

  - region: United Kingdom
    items:
      - name: A Millennium of Macroeconomic Data
        description: "Macroeconomic data compiled by the Bank of England from various sources. Series are spliced from various sources and regularly updated with modern data. These data are also available on [FRED](https://fred.stlouisfed.org/categories/33839)."
        links: [{label: "Link", url: https://www.bankofengland.co.uk/statistics/research-datasets}]
      - name: Gregory Clark
        description: "Income, wages and prices for England starting in medieval times."
        links: [{label: "Link", url: "http://faculty.econ.ucdavis.edu/faculty/gclark/data.html"}]

  - region: Scandinavia
    items:
      - name: Historical Monetary Statistics for Norway
        description: "Macroeconomic data maintained by Norges Bank starting in the early 19th century."
        links: [{label: "Link", url: "https://www.norges-bank.no/en/topics/Statistics/Historical-monetary-statistics/"}]
      - name: Historical Monetary Statistics of Sweden
        description: "Macroeconomic data maintained by the Riksbank partly ranging back to the 13th century."
        links: [{label: "Link", url: "https://www.riksbank.se/en-gb/statistics/historical-monetary-statistics-of-sweden/"}]

  - region: Switzerland
    items:
      - name: "Historical Statistics of Switzerland Online (HSSO)"
        description: "Historical statistics for Switzerland and the cantons starting in the 19th century, maintained by the University of Zurich."
        links: [{label: "Link", url: "https://hsso.ch/"}]

modern:
  - region: Multicountry
    items:
      - name: OECD
        description: "Data on all aspects of the economy for OECD countries. STATS supports generating large cross-country data sets; DATA features less data but charting capabilities."
        links:
          - {label: "STATS", url: "http://stats.oecd.org/"}
          - {label: "DATA", url: "https://data.oecd.org/"}
      - name: IMF
        description: "Macroeconomic data from the IMF. Good coverage of aspects of the international economy."
        links: [{label: "Link", url: "http://data.imf.org"}]

  - region: United States
    items:
      - name: FRED
        description: "Data collection covering all aspects of the US economy, with extensive on-site transformation and charting."
        links:
          - {label: "FRED", url: "https://fred.stlouisfed.org/"}
      - name: ALFRED
        description: "ALFRED is the real-time vintage data collection of FRED."
        links:
          - {label: "ALFRED", url: "https://alfred.stlouisfed.org/"}
      - name: Philadelphia Fed
        description: "Real-time data center assembling data and forecasts from the Greenbook, the Survey of Professional Forecasters and the Livingston Survey."
        links: [{label: "Link", url: "https://www.philadelphiafed.org/research-and-data/real-time-center"}]

  - region: Switzerland
    items:
      - name: dataseries.org
        description: "The Swiss FRED."
        links: [{label: "Link", url: "http://dataseries.org"}]
      - name: Swiss National Bank
        description: "Macroeconomic statistics from the Swiss central bank."
        links: [{label: "Link", url: "https://data.snb.ch/"}]
